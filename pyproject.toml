[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "subconscious-latent-engine"
version = "0.1.0"
description = "Disaggregated VRAM-to-RAM Subconscious-Active Latent Reasoning Engine (6GB VRAM Target)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "safetensors>=0.4.3",
    "accelerate>=0.33.0",
    "huggingface_hub>=0.24.0",
    "psutil>=5.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
